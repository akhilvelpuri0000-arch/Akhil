<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ramapuram Saga — Word Puzzle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&family=Noto+Sans+Telugu:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --indigo: #1F2A44;
    --indigo-deep: #141c30;
    --marigold: #E8A33D;
    --maroon: #7A2E2E;
    --cream: #F5EFE6;
    --leaf: #4C7A5B;
    --cell-idle: #2A3757;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100vh;
    background:
      radial-gradient(circle at 20% 0%, rgba(232,163,61,0.08), transparent 40%),
      radial-gradient(circle at 90% 100%, rgba(122,46,46,0.15), transparent 45%),
      var(--indigo);
    color: var(--cream); font-family: 'Inter', sans-serif;
    display: flex; justify-content: center; padding: 24px 14px 60px;
    overflow-x: hidden;
  }
  .telugu { font-family: 'Noto Sans Telugu', sans-serif; }
  .wrap { width: 100%; max-width: 480px; }
  .hidden { display: none !important; }

  /* ---------- Profile setup ---------- */
  #setupScreen { padding-top: 30px; }
  #setupScreen h1 { font-family:'Poppins',sans-serif; font-weight:800; font-size:24px; margin-bottom:4px; }
  #setupScreen p.sub { opacity:0.7; font-size:14px; margin-bottom:26px; }
  .field-label { font-size:13px; font-weight:600; margin-bottom:8px; color:var(--marigold); font-family:'Poppins',sans-serif; }
  #nameInput {
    width:100%; padding:13px 14px; border-radius:10px; border:1px solid rgba(245,239,230,0.2);
    background:var(--indigo-deep); color:var(--cream); font-size:15px; font-family:'Inter',sans-serif;
    margin-bottom:24px;
  }
  .avatar-grid { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:30px; }
  .avatar-opt {
    width:52px; height:52px; border-radius:50%; background:var(--cell-idle); display:flex;
    align-items:center; justify-content:center; font-size:24px; cursor:pointer; border:2px solid transparent;
  }
  .avatar-opt.selected { border-color:var(--marigold); background:rgba(232,163,61,0.15); }
  .primary-btn {
    font-family:'Poppins',sans-serif; font-weight:700; font-size:15px; background:var(--marigold);
    color:var(--indigo-deep); border:none; padding:13px 24px; border-radius:10px; cursor:pointer; width:100%;
  }
  .primary-btn:active { transform:scale(0.98); }

  /* ---------- Home screen ---------- */
  #homeScreen { padding-top:6px; }
  .profile-row { display:flex; align-items:center; gap:12px; margin-bottom:22px; }
  .profile-avatar { width:48px; height:48px; border-radius:50%; background:var(--cell-idle); display:flex; align-items:center; justify-content:center; font-size:22px; }
  .profile-name { font-family:'Poppins',sans-serif; font-weight:700; font-size:16px; }
  .profile-meta { font-size:12.5px; opacity:0.65; }
  .stat-strip { display:flex; gap:10px; margin-bottom:28px; }
  .stat-pill {
    flex:1; background:var(--indigo-deep); border:1px solid rgba(245,239,230,0.1);
    border-radius:12px; padding:12px 10px; text-align:center;
  }
  .stat-pill .num { font-family:'Poppins',sans-serif; font-weight:800; font-size:19px; color:var(--marigold); }
  .stat-pill .lbl { font-size:11px; opacity:0.65; margin-top:2px; }
  #homeScreen h1 { font-family:'Poppins',sans-serif; font-weight:800; font-size:23px; margin:0 0 6px; line-height:1.2; }
  #homeScreen .desc { font-size:14px; opacity:0.75; margin-bottom:24px; line-height:1.5; }

  /* ---------- Game ---------- */
  .topbar { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px; }
  .chapter-label { font-family:'Poppins',sans-serif; font-weight:700; font-size:12.5px; letter-spacing:0.02em; color:var(--marigold); }
  .streak { font-size:13px; opacity:0.7; }
  #levelTitle { font-family:'Poppins',sans-serif; font-weight:800; font-size:24px; margin:2px 0 18px; line-height:1.15; }
  #levelTitle span { color:var(--marigold); }

  .grid { display:grid; gap:5px; margin-bottom:18px; touch-action:none; user-select:none; }
  .cell {
    aspect-ratio:1; background:var(--cell-idle); border-radius:8px; display:flex; align-items:center;
    justify-content:center; font-family:'Poppins',sans-serif; font-weight:700; font-size:16px; color:var(--cream);
    cursor:pointer; transition:background 0.12s ease, transform 0.12s ease;
  }
  .cell.active { background:var(--marigold); color:var(--indigo-deep); transform:scale(1.04); }
  .cell.found { background:var(--leaf); color:var(--cream); }
  .cell.golden.found { background:linear-gradient(135deg,#E8A33D,#f2c368); color:var(--indigo-deep); }

  .wordbank { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:22px; }
  .word-chip {
    font-size:13px; font-weight:500; padding:6px 12px; border-radius:999px;
    background:rgba(245,239,230,0.08); border:1px solid rgba(245,239,230,0.18); opacity:0.85;
  }
  .word-chip .tc { font-family:'Noto Sans Telugu',sans-serif; }
  .word-chip.done { background:rgba(76,122,91,0.25); border-color:var(--leaf); text-decoration:line-through; opacity:0.55; }
  .word-chip.golden { border-color:var(--marigold); }

  .backlink { font-size:13px; opacity:0.6; margin-bottom:14px; display:inline-block; cursor:pointer; }

  /* ---------- Story / vignette ---------- */
  .storybox {
    background:var(--indigo-deep); border:1px solid rgba(232,163,61,0.25); border-radius:14px;
    padding:18px 20px; display:none; position:relative; overflow:hidden;
  }
  .storybox.show { display:block; animation:reveal 0.4s ease; }
  @keyframes reveal { from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .storybox .tag { font-family:'Poppins',sans-serif; font-size:11px; font-weight:700; color:var(--marigold); margin-bottom:8px; }
  .storybox p { font-size:15px; line-height:1.6; margin:0 0 14px; }
  .storybox .divider { border:none; border-top:1px dashed rgba(245,239,230,0.2); margin:0 0 12px; }
  .storybox .telugu-line { font-family:'Noto Sans Telugu',sans-serif; font-size:15px; line-height:1.7; opacity:0.95; margin-bottom:16px; }
  .reward-row { display:flex; gap:14px; margin-bottom:16px; }
  .reward-chip { font-size:13px; background:rgba(232,163,61,0.12); border:1px solid rgba(232,163,61,0.3); padding:6px 12px; border-radius:8px; }

  .question-box { border-top:1px dashed rgba(245,239,230,0.15); padding-top:14px; margin-bottom:16px; }
  .q-tag { font-family:'Poppins',sans-serif; font-size:11px; font-weight:700; color:var(--marigold); margin-bottom:8px; }
  .question-box p { font-size:14.5px; margin:0 0 6px; }
  .q-te { font-size:13px; opacity:0.75; margin-bottom:12px; font-family:'Noto Sans Telugu',sans-serif; }
  .q-options { display:flex; flex-direction:column; gap:8px; }
  .q-option-btn {
    text-align:left; padding:11px 14px; border-radius:10px; background:var(--indigo-deep);
    border:1px solid rgba(245,239,230,0.15); color:var(--cream); font-size:14px; cursor:pointer; font-family:'Inter',sans-serif;
  }
  .q-option-btn:active { background:var(--cell-idle); }
  .q-option-btn .ote { font-family:'Noto Sans Telugu',sans-serif; font-size:12.5px; opacity:0.65; display:block; margin-top:3px; }
  #reactionBox p { font-size:14px; margin:0 0 4px; }
  #reactionBox .telugu { font-size:13px; opacity:0.8; margin-bottom:14px; }

  .confetti-piece { position:absolute; top:-10px; width:8px; height:8px; border-radius:2px; animation:fall 1.4s ease-in forwards; }
  @keyframes fall { to { transform: translateY(220px) rotate(360deg); opacity:0; } }

  .end-note { text-align:center; padding:6px 0 0; font-size:12.5px; opacity:0.55; }
</style>
</head>
<body>
<div class="wrap">

  <!-- SETUP -->
  <div id="setupScreen">
    <h1>Ramapuram Saga</h1>
    <p class="sub">Word puzzles, unlocked one village story at a time.</p>
    <div class="field-label">YOUR NAME</div>
    <input id="nameInput" placeholder="e.g. Priya" maxlength="18">
    <div class="field-label">PICK AN AVATAR</div>
    <div class="avatar-grid" id="avatarGrid"></div>
    <button class="primary-btn" id="setupBtn">Start Playing</button>
  </div>

  <!-- HOME -->
  <div id="homeScreen" class="hidden">
    <div class="profile-row">
      <div class="profile-avatar" id="homeAvatar"></div>
      <div>
        <div class="profile-name" id="homeName"></div>
        <div class="profile-meta" id="homeMeta"></div>
      </div>
    </div>
    <div class="stat-strip">
      <div class="stat-pill"><div class="num" id="statLevel">1</div><div class="lbl">Level</div></div>
      <div class="stat-pill"><div class="num" id="statStars">0</div><div class="lbl">⭐ Stars</div></div>
      <div class="stat-pill"><div class="num" id="statStreak">0</div><div class="lbl">🔥 Streak</div></div>
    </div>
    <h1 id="homeTitle">Chapter 1: Amma's Kitchen</h1>
    <p class="desc" id="homeDesc">Lakshmi's story begins where every village story does — the kitchen.</p>
    <button class="primary-btn" id="playBtn">Play →</button>
  </div>

  <!-- GAME -->
  <div id="gameScreen" class="hidden">
    <span class="backlink" id="backLink">← Menu</span>
    <div class="topbar">
      <div class="chapter-label" id="chapterLabel">CHAPTER 1</div>
      <div class="streak" id="streakLabel">🔥 0</div>
    </div>
    <div id="levelTitle">Find the words</div>
    <div class="grid" id="grid"></div>
    <div class="wordbank" id="wordbank"></div>
  </div>

  <!-- STORY / VIGNETTE -->
  <div class="storybox" id="storybox">
    <div class="tag" id="storyTag">📖 STORY UNLOCKED</div>
    <p id="storyText"></p>
    <hr class="divider">
    <div class="telugu-line telugu" id="storyTelugu"></div>
    <div class="reward-row" id="rewardRow"></div>

    <div id="questionBox" class="question-box hidden">
      <div class="q-tag">🤔 YOUR GUESS</div>
      <p id="qText"></p>
      <div class="q-te" id="qTeText"></div>
      <div class="q-options" id="qOptions"></div>
    </div>

    <div id="reactionBox" class="hidden">
      <p id="reactionText"></p>
      <div class="telugu" id="reactionTe"></div>
    </div>

    <button class="primary-btn hidden" id="nextBtn">Continue →</button>
  </div>

</div>

<script>
/* ================= DATA ================= */
const AVATARS = ['🧕','👩‍🌾','👨‍🌾','🧑‍🎓','👵','👴','🧑‍🍳','🐘'];

const CHAPTERS = [
  { title:"Chapter 1: Amma's Kitchen", size:8,
    words:[{en:"RICE",te:"అన్నం"},{en:"SPICE",te:"మసాలా"},{en:"CURRY",te:"కూర"},{en:"MANGO",te:"మామిడి"}],
    story:"Lakshmi stirs the curry slowly, the same way her mother once did in this very kitchen. Outside, she hears her brother Ravi's motorbike — he's back from the city, and he never visits without a reason.",
    storyTe:"లక్ష్మి కూర నెమ్మదిగా కలుపుతోంది, ఈ వంటగదిలోనే ఆమె అమ్మ ఒకప్పుడు చేసినట్టుగానే. బయట ఆమెకు తన అన్న రవి మోటార్‌బైక్ శబ్దం వినిపిస్తుంది — అతను నగరం నుండి తిరిగి వచ్చాడు, ఏదో కారణం లేకుండా అతను రాడు." },
  { title:"Chapter 2: The Village Well", size:8,
    words:[{en:"WATER",te:"నీరు"},{en:"ROPE",te:"తాడు"},{en:"BUCKET",te:"బకెట్"},{en:"WELL",te:"బావి"}],
    story:'"The land near the well," Ravi says quietly, "a company wants to buy it. They\'re offering more money than we\'ve seen in ten years." Lakshmi\'s hands stop moving. That well fed their whole family through the drought.',
    storyTe:"'బావి పక్కనున్న భూమి,' రవి మెల్లగా చెప్తాడు, 'ఒక కంపెనీ దాన్ని కొనాలనుకుంటోంది. పదేళ్లలో చూడని డబ్బు ఇస్తున్నారు.' లక్ష్మి చేతులు ఆగిపోతాయి. కరువు కాలంలో ఆ బావే వారి కుటుంబాన్ని పోషించింది." },
  { title:"Chapter 3: The Family Shrine", size:8,
    words:[{en:"TEMPLE",te:"గుడి"},{en:"LAMP",te:"దీపం"},{en:"FLOWER",te:"పువ్వు"},{en:"PRAYER",te:"ప్రార్థన"},{en:"BELL",te:"గంట"}],
    story:'That night, Lakshmi lights a lamp at the shrine her grandmother built. "Ammamma sold her jewelry to dig this well," she whispers. "I won\'t let it go for money." But Ravi has already signed something in the city...',
    storyTe:"ఆ రాత్రి, లక్ష్మి తన అమ్మమ్మ కట్టించిన గుడి దగ్గర దీపం వెలిగిస్తుంది. 'ఈ బావి తవ్వడానికి అమ్మమ్మ తన నగలు అమ్మింది,' అని గుసగుసగా చెప్తుంది. 'దీన్ని డబ్బుకు అమ్మనివ్వను.' కానీ రవి ఇప్పటికే నగరంలో ఏదో సంతకం చేశాడు..." },
  { title:"Chapter 4: The Panchayat Meeting", size:9,
    words:[{en:"COUNCIL",te:"పంచాయితీ"},{en:"CHAIR",te:"కుర్చీ"},{en:"VOICE",te:"గొంతు"},{en:"VILLAGE",te:"గ్రామం"},{en:"ELDER",te:"పెద్దలు"}],
    story:'The whole village gathers under the banyan tree. Ravi stands to explain the offer — but the village elder, who dug that well himself sixty years ago, rises before Ravi can finish a sentence.',
    storyTe:"ఊరు మొత్తం మర్రిచెట్టు కింద చేరుతుంది. రవి ఆఫర్ గురించి వివరించడానికి లేస్తాడు — కానీ అరవై ఏళ్ల క్రితం ఆ బావిని స్వయంగా తవ్విన గ్రామ పెద్ద, రవి మాట పూర్తి చేయకముందే లేస్తాడు." },
  { title:"Chapter 5: The Old Letter", size:9,
    words:[{en:"LETTER",te:"ఉత్తరం"},{en:"DIARY",te:"డైరీ"},{en:"SEAL",te:"ముద్ర"},{en:"INK",te:"సిరా"},{en:"PAPER",te:"కాగితం"}],
    story:'In grandmother\'s old trunk, Lakshmi finds a letter — the well was never meant for one family. It was dug for the whole village, in a year when everyone nearly lost everything. Ravi reads it twice, in silence.',
    storyTe:"అమ్మమ్మ పాత పెట్టెలో, లక్ష్మికి ఒక ఉత్తరం దొరుకుతుంది — ఆ బావి ఎప్పుడూ ఒక్క కుటుంబం కోసం కాదు. అందరూ దాదాపు అన్నీ కోల్పోయిన ఒక సంవత్సరంలో, ఊరు మొత్తం కోసం తవ్వారు. రవి దాన్ని మౌనంగా రెండుసార్లు చదువుతాడు." },
  { title:"Chapter 6: The Harvest Festival", size:9,
    words:[{en:"FESTIVAL",te:"పండుగ"},{en:"DRUM",te:"డప్పు"},{en:"DANCE",te:"నృత్యం"},{en:"LANTERN",te:"లాంతరు"},{en:"SWEETS",te:"తీపి"}],
    story:'At the harvest festival, Ravi stands with the village and tears up the company\'s offer. Drums play till midnight. The well stays — not as one family\'s secret, but as everyone\'s inheritance.',
    storyTe:"పంట పండుగలో, రవి ఊరితో పాటు నిలబడి కంపెనీ ఆఫర్‌ను చించేస్తాడు. అర్ధరాత్రి వరకు డప్పులు మోగుతాయి. బావి అలాగే ఉండిపోతుంది — ఒక్క కుటుంబం రహస్యంగా కాదు, అందరి వారసత్వంగా." }
];

const CATEGORY_POOLS = {
  "The Market": [{en:"BASKET",te:"బుట్ట"},{en:"ONION",te:"ఉల్లి"},{en:"COTTON",te:"పత్తి"},{en:"COIN",te:"నాణెం"},{en:"CLOTH",te:"బట్ట"},{en:"SCALE",te:"త్రాసు"}],
  "The Farm": [{en:"PLOUGH",te:"నాగలి"},{en:"SEED",te:"విత్తనం"},{en:"BULLOCK",te:"ఎద్దు"},{en:"FIELD",te:"పొలం"},{en:"GRAIN",te:"ధాన్యం"},{en:"HARVEST",te:"కోత"}],
  "The School": [{en:"SLATE",te:"పలక"},{en:"CHALK",te:"సుద్ద"},{en:"TEACHER",te:"గురువు"},{en:"BOOK",te:"పుస్తకం"},{en:"BENCH",te:"బెంచి"}],
  "Monsoon Days": [{en:"CLOUD",te:"మేఘం"},{en:"THUNDER",te:"ఉరుము"},{en:"UMBRELLA",te:"గొడుగు"},{en:"PUDDLE",te:"గుంట"},{en:"RAINBOW",te:"హరివిల్లు"}],
  "Festival Night": [{en:"DIYA",te:"దీపం"},{en:"RANGOLI",te:"రంగవల్లి"},{en:"SWEETS",te:"తీపి"},{en:"CRACKER",te:"టపాకాయ"},{en:"KITE",te:"గాలిపటం"}],
  "The Temple": [{en:"BELL",te:"గంట"},{en:"INCENSE",te:"అగరుబత్తి"},{en:"IDOL",te:"విగ్రహం"},{en:"PRIEST",te:"పూజారి"},{en:"FLOWER",te:"పువ్వు"}]
};

const VIGNETTES = [
  {en:"Lakshmi's daughter learns her first rangoli pattern, chalk dust on her fingers.", te:"లక్ష్మి కూతురు తన మొదటి రంగవల్లి నమూనా నేర్చుకుంటుంది, వేళ్లకు సుద్ద పొడి అంటుకుంటుంది."},
  {en:"The old teacher retires this year — the whole village plans a send-off.", te:"ఈ సంవత్సరం పాత గురువు రిటైర్ అవుతున్నారు — ఊరు మొత్తం వీడ్కోలు వేడుక ప్లాన్ చేస్తోంది."},
  {en:"First rains of the season. Children run barefoot into the fields.", te:"సీజన్ మొదటి వర్షాలు. పిల్లలు చెప్పులు లేకుండా పొలాల్లోకి పరిగెడతారు."},
  {en:"Ravi opens a small shop in the market — his first business.", te:"రవి మార్కెట్‌లో చిన్న దుకాణం తెరుస్తాడు — అతని మొదటి వ్యాపారం."},
  {en:"The temple bell rings for a wedding this Sunday.", te:"ఈ ఆదివారం పెళ్లి కోసం గుడి గంట మోగుతుంది."},

];

const QUESTIONS = [
  { q:"Why do you think Ravi came back to the village?", qTe:"రవి ఎందుకు తిరిగి వచ్చాడని మీరు అనుకుంటున్నారు?",
    options:[{en:"For a new business idea",te:"కొత్త వ్యాపారం కోసం"},{en:"To talk about the land",te:"భూమి గురించి మాట్లాడటానికి"},{en:"Just to visit home",te:"ఇంటిని చూసేందుకు మాత్రమే"}],
    reaction:"Interesting guess! The truth unfolds in the next chapter...", reactionTe:"తర్వాత చాప్టర్‌లో నిజం తెలుస్తుంది..." },
  { q:"What do you think Lakshmi will do?", qTe:"లక్ష్మి ఏమి చేస్తుందని మీరు అనుకుంటున్నారు?",
    options:[{en:"Agree to sell the well",te:"బావిని అమ్మడానికి ఒప్పుకుంటుంది"},{en:"Refuse and resist",te:"వ్యతిరేకిస్తుంది"},{en:"Ask the village elders",te:"పెద్దలను అడుగుతుంది"}],
    reaction:"We'll see her decision soon.", reactionTe:"ఆమె నిర్ణయం తర్వాత చాప్టర్‌లో చూద్దాం." },
  { q:"What do you think Ravi signed in the city?", qTe:"రవి నగరంలో ఏమి సంతకం చేసి ఉంటాడు?",
    options:[{en:"A sale agreement",te:"అమ్మకం ఒప్పందం"},{en:"Just a form",te:"కేవలం ఒక ఫారం"},{en:"Nothing final yet",te:"ఇంకా ఏమీ ఖరారు కాలేదు"}],
    reaction:"The panchayat meeting will reveal everything.", reactionTe:"పంచాయితీ సమావేశంలో నిజం బయటపడుతుంది." },
  { q:"What do you think the village elder will say?", qTe:"గ్రామ పెద్ద ఏమి చెప్తారని మీరు అనుకుంటున్నారు?",
    options:[{en:"Remind everyone of the well's history",te:"బావి చరిత్ర గుర్తు చేస్తారు"},{en:"Support Ravi's decision",te:"రవిని మద్దతు ఇస్తారు"},{en:"Leave it to the village",te:"నిర్ణయం ఊరికే వదిలేస్తారు"}],
    reaction:"An old letter is about to change everything...", reactionTe:"పాత ఉత్తరం అసలు నిజం చెప్తుంది..." },
  { q:"What will Ravi do after reading the letter?", qTe:"ఉత్తరం చదివాక రవి ఏమి చేస్తాడు?",
    options:[{en:"Change his mind",te:"మనసు మారుస్తాడు"},{en:"Go ahead with the sale anyway",te:"అమ్మకాన్నే కొనసాగిస్తాడు"},{en:"Still think it over",te:"ఇంకా ఆలోచిస్తాడు"}],
    reaction:"The answer comes on festival day.", reactionTe:"పండుగ రోజున సమాధానం వస్తుంది." },
  { q:"Did you enjoy Ramapuram's story?", qTe:"ఈ కథ మీకు నచ్చిందా?",
    options:[{en:"Loved it",te:"చాలా బాగుంది"},{en:"It was good",te:"బాగుంది"},{en:"Could be better",te:"ఇంకా improve చేయొచ్చు"}],
    reaction:"Your feedback matters! More stories coming in Endless Village Life.", reactionTe:"మీ అభిప్రాయం విలువైనది! ఇంకా కథలు రాబోతున్నాయి." }
];

const GENERIC_QUESTIONS = [
  { q:"What do you think happens in the village this week?", qTe:"ఈ వారం ఊర్లో ఏమి జరగొచ్చు?",
    options:[{en:"A festival is coming",te:"పండుగ వస్తుంది"},{en:"Someone new arrives",te:"కొత్తవారు వస్తారు"},{en:"Nothing special",te:"ఏమీ ప్రత్యేకం లేదు"}],
    reaction:"Village stories are always interesting!", reactionTe:"ఊరి కథలు ఎప్పుడూ ఆసక్తికరంగా ఉంటాయి!" },
  { q:"Which character do you like most so far?", qTe:"మీకు ఏ పాత్ర ఎక్కువ నచ్చింది?",
    options:[{en:"Lakshmi",te:"లక్ష్మి"},{en:"Ravi",te:"రవి"},{en:"The village elder",te:"గ్రామ పెద్ద"}],
    reaction:"Great choice!", reactionTe:"మంచి ఎంపిక!" },
  { q:"What kind of level do you want next?", qTe:"తర్వాత level ఎలా ఉండాలని అనుకుంటున్నారు?",
    options:[{en:"Easier",te:"సులభమైనది"},{en:"More challenging",te:"సవాలుగా"},{en:"Just like this",te:"ఇలాగే ఉండాలి"}],
    reaction:"Noted!", reactionTe:"నోట్ చేసుకున్నా!" }
];

let usedVignettes = [];

/* ================= STATE ================= */
let profile = null;
let progress = null;
let currentLevel = null;
let size, wordList, selectedCells = [], isSelecting = false, foundWords = new Set(), gridData = [], goldenWord = null, wrongPick = false;

/* ================= STORAGE ================= */
async function loadProfile() {
  try {
    const r = await window.storage.get('profile', false);
    return r ? JSON.parse(r.value) : null;
  } catch (e) { return null; }
}
async function saveProfile(p) {
  try { await window.storage.set('profile', JSON.stringify(p), false); } catch(e){}
}
async function loadProgress() {
  try {
    const r = await window.storage.get('progress', false);
    return r ? JSON.parse(r.value) : null;
  } catch (e) { return null; }
}
async function saveProgress(p) {
  try { await window.storage.set('progress', JSON.stringify(p), false); } catch(e){}
}

function todayStr(){ return new Date().toISOString().slice(0,10); }
function updateStreak() {
  const today = todayStr();
  if (progress.lastPlayed === today) return;
  if (progress.lastPlayed) {
    const diff = (new Date(today) - new Date(progress.lastPlayed)) / 86400000;
    progress.streak = diff === 1 ? progress.streak + 1 : 1;
  } else {
    progress.streak = 1;
  }
  progress.lastPlayed = today;
  saveProgress(progress);
}

/* ================= SETUP SCREEN ================= */
const avatarGrid = document.getElementById('avatarGrid');
let chosenAvatar = AVATARS[0];
AVATARS.forEach((a,i) => {
  const d = document.createElement('div');
  d.className = 'avatar-opt' + (i===0 ? ' selected' : '');
  d.textContent = a;
  d.addEventListener('click', () => {
    chosenAvatar = a;
    [...avatarGrid.children].forEach(c => c.classList.remove('selected'));
    d.classList.add('selected');
  });
  avatarGrid.appendChild(d);
});
document.getElementById('setupBtn').addEventListener('click', async () => {
  const name = document.getElementById('nameInput').value.trim() || 'Player';
  profile = { name, avatar: chosenAvatar };
  await saveProfile(profile);
  progress = { levelIndex: 0, stars: 0, lastPlayed: null, streak: 0 };
  await saveProgress(progress);
  showHome();
});

/* ================= HOME SCREEN ================= */
function showHome() {
  document.getElementById('setupScreen').classList.add('hidden');
  document.getElementById('gameScreen').classList.add('hidden');
  document.getElementById('storybox').classList.remove('show');
  document.getElementById('homeScreen').classList.remove('hidden');

  document.getElementById('homeAvatar').textContent = profile.avatar;
  document.getElementById('homeName').textContent = profile.name;
  const inStory = progress.levelIndex < CHAPTERS.length;
  document.getElementById('homeMeta').textContent = inStory ? `Village Saga · Level ${progress.levelIndex+1}` : `Endless Village Life · Level ${progress.levelIndex+1}`;
  document.getElementById('statLevel').textContent = progress.levelIndex+1;
  document.getElementById('statStars').textContent = progress.stars;
  document.getElementById('statStreak').textContent = progress.streak;

  if (inStory) {
    document.getElementById('homeTitle').textContent = CHAPTERS[progress.levelIndex].title;
    document.getElementById('homeDesc').textContent = "Continue Lakshmi's story — every level unlocks the next part.";
  } else {
    document.getElementById('homeTitle').textContent = "Endless Village Life";
    document.getElementById('homeDesc').textContent = "The saga continues in everyday moments — unlimited levels, new word themes every time.";
  }
}
document.getElementById('playBtn').addEventListener('click', () => { updateStreak(); startLevel(progress.levelIndex); });
document.getElementById('backLink').addEventListener('click', showHome);

/* ================= LEVEL GENERATION ================= */
function getLevelData(idx) {
  if (idx < CHAPTERS.length) {
    const c = CHAPTERS[idx];
    return { chapterLabel: `CHAPTER ${idx+1} OF ${CHAPTERS.length}`, title: c.title, size: c.size, words: c.words, story: c.story, storyTe: c.storyTe, isVignette: false, question: QUESTIONS[idx] };
  }
  // procedural endless mode
  const catNames = Object.keys(CATEGORY_POOLS);
  const cat = catNames[idx % catNames.length];
  const pool = CATEGORY_POOLS[cat];
  const size = 8 + (idx % 3);
  const count = Math.min(pool.length, 4 + (idx % 2));
  const shuffled = [...pool].sort(() => Math.random()-0.5).filter(w => w.en.length <= size).slice(0, count);
  if (usedVignettes.length >= VIGNETTES.length) usedVignettes = [];
  let v;
  do { v = VIGNETTES[Math.floor(Math.random()*VIGNETTES.length)]; } while (usedVignettes.includes(v) && usedVignettes.length < VIGNETTES.length);
  usedVignettes.push(v);
  const question = (idx % 3 === 0) ? GENERIC_QUESTIONS[Math.floor(idx/3) % GENERIC_QUESTIONS.length] : null;
  return { chapterLabel: `${cat.toUpperCase()} · LEVEL ${idx+1}`, title: `Find the words <span>at ${cat}</span>`, size, words: shuffled, story: v.en, storyTe: v.te, isVignette: true, question };
}

function startLevel(idx) {
  currentLevel = getLevelData(idx);
  size = currentLevel.size;
  wordList = currentLevel.words;
  foundWords = new Set();
  wrongPick = false;
  goldenWord = wordList.length > 2 ? wordList[Math.floor(Math.random()*wordList.length)].en : null;

  document.getElementById('homeScreen').classList.add('hidden');
  document.getElementById('storybox').classList.remove('show');
  document.getElementById('gameScreen').classList.remove('hidden');
  document.getElementById('chapterLabel').textContent = currentLevel.chapterLabel;
  document.getElementById('streakLabel').textContent = `🔥 ${progress.streak}`;
  document.getElementById('levelTitle').innerHTML = currentLevel.title;

  gridData = Array.from({length:size}, () => Array(size).fill(''));
  const dirs = [[0,1],[1,0],[1,1],[0,-1],[-1,0]];
  wordList.forEach(w => {
    const word = w.en;
    let placed=false, attempts=0;
    while (!placed && attempts<200) {
      attempts++;
      const dir = dirs[Math.floor(Math.random()*dirs.length)];
      const row = Math.floor(Math.random()*size), col = Math.floor(Math.random()*size);
      const endRow = row+dir[0]*(word.length-1), endCol = col+dir[1]*(word.length-1);
      if (endRow<0||endRow>=size||endCol<0||endCol>=size) continue;
      let ok=true;
      for (let i=0;i<word.length;i++){ const r=row+dir[0]*i,c=col+dir[1]*i; if (gridData[r][c]!=='' && gridData[r][c]!==word[i]){ok=false;break;} }
      if (!ok) continue;
      for (let i=0;i<word.length;i++){ const r=row+dir[0]*i,c=col+dir[1]*i; gridData[r][c]=word[i]; }
      placed=true;
    }
  });
  const letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  for (let r=0;r<size;r++) for (let c=0;c<size;c++) if (gridData[r][c]==='') gridData[r][c]=letters[Math.floor(Math.random()*26)];

  renderGrid();
  renderWordbank();
}

/* ================= GRID INTERACTION ================= */
const gridEl = document.getElementById('grid');
function renderGrid() {
  gridEl.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
  gridEl.innerHTML = '';
  for (let r=0;r<size;r++) for (let c=0;c<size;c++) {
    const div = document.createElement('div');
    div.className = 'cell';
    div.textContent = gridData[r][c];
    div.dataset.r = r;
    div.dataset.c = c;
    div.addEventListener('pointerdown', (e) => { e.preventDefault(); startSelect(r,c); });
    gridEl.appendChild(div);
  }
}
function handlePointerMove(e){
  if (!isSelecting) return;
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const cell = el && el.closest ? el.closest('.cell') : null;
  if (!cell || !gridEl.contains(cell)) return;
  continueSelect(parseInt(cell.dataset.r), parseInt(cell.dataset.c));
}
document.addEventListener('pointermove', handlePointerMove);
document.addEventListener('pointerup', endSelect);
function renderWordbank() {
  const wb = document.getElementById('wordbank');
  wb.innerHTML = '';
  wordList.forEach(w => {
    const chip = document.createElement('div');
    chip.className = 'word-chip' + (foundWords.has(w.en)?' done':'') + (w.en===goldenWord?' golden':'');
    chip.innerHTML = `${w.en===goldenWord?'⭐ ':''}${w.en} <span class="tc telugu">· ${w.te}</span>`;
    wb.appendChild(chip);
  });
}
function cellEl(r,c){ return gridEl.children[r*size+c]; }
function startSelect(r,c){ isSelecting=true; selectedCells=[[r,c]]; paintSelection(); }
function continueSelect(r,c){
  if (!isSelecting) return;
  if (selectedCells.length===1 || isInLine(selectedCells[0],[r,c])) { selectedCells=lineBetween(selectedCells[0],[r,c]); paintSelection(); }
}
function isInLine(s,e){ const dr=e[0]-s[0],dc=e[1]-s[1]; return dr===0||dc===0||Math.abs(dr)===Math.abs(dc); }
function lineBetween(s,e){ const dr=Math.sign(e[0]-s[0]),dc=Math.sign(e[1]-s[1]); const len=Math.max(Math.abs(e[0]-s[0]),Math.abs(e[1]-s[1])); const cells=[]; for(let i=0;i<=len;i++) cells.push([s[0]+dr*i,s[1]+dc*i]); return cells; }
function paintSelection(){ for(let r=0;r<size;r++) for(let c=0;c<size;c++) cellEl(r,c).classList.remove('active'); selectedCells.forEach(([r,c])=>{ if(!cellEl(r,c).classList.contains('found')) cellEl(r,c).classList.add('active'); }); }
function endSelect(){
  if (!isSelecting) return;
  isSelecting=false;
  const str = selectedCells.map(([r,c])=>gridData[r][c]).join('');
  const rev = str.split('').reverse().join('');
  const match = wordList.find(w => (w.en===str||w.en===rev) && !foundWords.has(w.en));
  if (match) {
    foundWords.add(match.en);
    const isGolden = match.en === goldenWord;
    selectedCells.forEach(([r,c])=>{ cellEl(r,c).classList.remove('active'); cellEl(r,c).classList.add('found'); if(isGolden) cellEl(r,c).classList.add('golden'); });
    renderWordbank();
    if (foundWords.size === wordList.length) setTimeout(showStory, 400);
  } else {
    if (str.length>1) wrongPick = true;
    selectedCells.forEach(([r,c])=>cellEl(r,c).classList.remove('active'));
  }
  selectedCells=[];
}

/* ================= STORY / REWARD ================= */
function launchConfetti(container){
  const colors = ['#E8A33D','#4C7A5B','#7A2E2E','#F5EFE6'];
  for (let i=0;i<24;i++){
    const p = document.createElement('div');
    p.className='confetti-piece';
    p.style.left = Math.random()*100+'%';
    p.style.background = colors[Math.floor(Math.random()*colors.length)];
    p.style.animationDelay = (Math.random()*0.3)+'s';
    container.appendChild(p);
    setTimeout(()=>p.remove(), 1800);
  }
}
function showStory(){
  document.getElementById('gameScreen').classList.add('hidden');
  const box = document.getElementById('storybox');
  document.getElementById('storyTag').textContent = currentLevel.isVignette ? '🌾 VILLAGE LIFE' : '📖 STORY UNLOCKED';
  document.getElementById('storyText').textContent = currentLevel.story;
  document.getElementById('storyTelugu').textContent = currentLevel.storyTe;

  const starsEarned = wrongPick ? 2 : 3;
  progress.stars += starsEarned;
  progress.levelIndex += 1;
  saveProgress(progress);
  document.getElementById('rewardRow').innerHTML = `<div class="reward-chip">⭐ +${starsEarned} stars</div><div class="reward-chip">🔥 ${progress.streak} day streak</div>`;

  const qBox = document.getElementById('questionBox');
  const reactionBox = document.getElementById('reactionBox');
  const nextBtn = document.getElementById('nextBtn');
  reactionBox.classList.add('hidden');
  nextBtn.classList.add('hidden');

  if (currentLevel.question) {
    qBox.classList.remove('hidden');
    document.getElementById('qText').textContent = currentLevel.question.q;
    document.getElementById('qTeText').textContent = currentLevel.question.qTe;
    const optWrap = document.getElementById('qOptions');
    optWrap.innerHTML = '';
    currentLevel.question.options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'q-option-btn';
      btn.innerHTML = `${opt.en}<span class="ote">${opt.te}</span>`;
      btn.addEventListener('click', () => {
        qBox.classList.add('hidden');
        reactionBox.classList.remove('hidden');
        document.getElementById('reactionText').textContent = currentLevel.question.reaction;
        document.getElementById('reactionTe').textContent = currentLevel.question.reactionTe;
        nextBtn.classList.remove('hidden');
      });
      optWrap.appendChild(btn);
    });
  } else {
    qBox.classList.add('hidden');
    nextBtn.classList.remove('hidden');
  }

  box.classList.add('show');
  launchConfetti(box);
}
document.getElementById('nextBtn').addEventListener('click', () => { showHome(); });

/* ================= BOOT ================= */
(async function boot(){
  profile = await loadProfile();
  progress = await loadProgress();
  if (profile && progress) { showHome(); }
  else { document.getElementById('setupScreen').classList.remove('hidden'); }
})();
</script>
